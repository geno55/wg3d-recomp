# splat config for analysis, not for building. Generated once from
# Rainchus/WayneGretzky3dHockey (its .text file boundaries) plus docs/rom_map.md.
# Run from the project root: python -m splat split splat/wg3d.us.yaml
name: W.G. 3D Hockey (US V1.0)
sha1: 400aa84811f1f2f6c62c756b43b54d534d5a5ec8
options:
  basename: wg3d
  target_path: baserom.us.z64
  base_path: ..
  platform: n64
  compiler: IDO
  find_file_boundaries: True
  header_encoding: ASCII
  disassemble_all: True
  symbol_addrs_path: [syms/libultra_symbols.txt]
  asm_path: build/splat/asm
  src_path: build/splat/src
  build_path: build/splat/build
  ld_script_path: build/splat/wg3d.ld
  undefined_funcs_auto_path: build/splat/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/splat/undefined_syms_auto.txt
  hardware_regs: True
  mips_abi_float_regs: o32
